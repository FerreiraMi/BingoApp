name: bingou
description: Um aplicativo de bingo para sorteio e visualização.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão do iOS
  cupertino_icons: ^1.0.2
  
  # Nossas dependências do projeto
  http: ^0.13.5
  web_socket_channel: ^2.2.0
  provider: ^6.0.4
  shared_preferences: ^2.0.15
  intl: ^0.17.0
  qr_flutter: ^4.0.0
  mobile_scanner: ^7.0.0
  url_launcher: ^6.3.2

  # Descomente estas linhas se/quando for implementar as funcionalidades
  # google_sign_in: ^5.4.2
  # flutter_facebook_auth: ^5.0.6
  # sign_in_with_apple: ^4.1.0
  # google_mobile_ads: ^2.0.1


dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  mocktail: ^1.0.4
  shared_preferences: ^2.0.15

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"  # Caminho da imagem do ícone
  min_sdk_android: 21
  
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
