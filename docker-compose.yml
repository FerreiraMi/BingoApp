version: '3.8'

services:
  web:
    build: ./web
    container_name: bingo_web
    ports:
      - "80:80"
    volumes:
      - ./web/app:/var/www/html
    environment:
      WS_ADDRESS: "ws://localhost:8080"
    depends_on:
      - db
      - websocket

  websocket:
    build: ./websocket
    container_name: bingo_websocket
    ports:
      - "8080:8080"
    environment:
      # Porta do WebSocket (usada pelo servidor Ratchet)
      WS_PORT: "8080"
    # Removemos o volume para não sobrescrever os arquivos instalados durante o build


  db:
    image: postgres:13
    container_name: bingo_db
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: nome_do_banco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mapeia o init.sql para inicializar o banco
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
