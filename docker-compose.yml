version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bingo-app
    environment:
      - MONGO_DSN=${MONGO_DSN}
      - WSHOST_NAME=ws://localhost:8080
    volumes:
      - ./backend:/var/www/html
    hostname: app-bingo
    networks:
      - bingo-net
    depends_on:
      - db

  websocket:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bingo-websocket
    command: php server.php
    environment:
      - MONGO_DSN=${MONGO_DSN}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    networks:
      - bingo-net
    depends_on:
      - db

  webserver:
    image: nginx:stable-alpine
    container_name: bingo-webserver
    environment:
      - MONGO_DSN=${MONGO_DSN}
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bingo-net
    depends_on:
      - app

  db:
    image: mongo:latest
    container_name: bingo-db
    restart: always
    #ports:
    #  - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bingo-net

networks:
  bingo-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local