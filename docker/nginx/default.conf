server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.html index.htm index.php;

    # Regra 1: Captura a URL do bingo (já implementada e correta)
    # Ex: /bingo/XYZ12 -> /bingo.php?shortId=XYZ12
    location ~ "^/bingo/([a-zA-Z0-9]{5})$" {
        try_files $uri /bingo.php?shortId=$1;
    }

    

    # =========================================================================
    # Regra 2 (MODIFICADA): Rota principal com lógica para "PHP sem extensão"
    # =========================================================================
    # Esta é a mudança principal. Para qualquer requisição, o Nginx tentará:
    # 1. Encontrar um arquivo com o nome exato ($uri).
    # 2. Encontrar um diretório com o nome exato ($uri/).
    # 3. Tentar encontrar um arquivo com o nome da requisição + a extensão .php.
    #    Ex: se a requisição é para /api/login, ele tentará servir /api/login.php
    location / {
        try_files $uri $uri/ $uri.php?$query_string;
    }

    # Regra 3: Processa todos os arquivos .php através do PHP-FPM (sem alteração)
    # Esta regra ainda é essencial, pois é ela que efetivamente executa o PHP.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app-bingo:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Regra 4: Nega o acesso a arquivos ocultos (sem alteração)
    location ~ /\.ht {
        deny all;
    }
}