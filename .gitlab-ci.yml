stages:
  - build
  - package
  - deploy

variables:
  REGISTRY: $CI_REGISTRY
  PROJECT: iw7.com.br/system/bingo-app
  KUBE_NAMESPACE: bingo-prod
  POSTGRES_CHART_VERSION: 11.9.2

build:
  stage: build
  image: docker:latest
  only:
    - main
  environment:
    name: production
  services:
    - docker:dind
  script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $REGISTRY/$PROJECT/web:latest ./web
    - docker push $CI_REGISTRY_IMAGE/web:latest
    - docker build -t $CI_REGISTRY_IMAGE/websocket:latest ./websocket
    - docker push $CI_REGISTRY_IMAGE/websocket:latest

package:
  stage: package
  image: alpine/helm:3.12.3
  script:
    - mkdir -p helm-charts
    
    # Web Service Chart
    - helm create helm-charts/web
    - |
      cat > helm-charts/web/values.yaml <<EOF
      image:
        repository: $CI_REGISTRY_IMAGE/web
        tag: latest
      service:
        type: ClusterIP
        port: 80
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/proxy-body-size: 50m
        hosts:
          - host: app-bingo.iw7.com.br
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: $TLS_SECRET_NAME
            hosts:
              - app-bingo.iw7.com.br
      env:
        WS_ADDRESS: "ws://ws-bingo.iw7.com.br"
      volumeMounts:
        - name: app-code
          mountPath: /var/www/html
      volumes:
        - name: app-code
          emptyDir: {}
      EOF

    # Websocket Service Chart
    - helm create helm-charts/websocket
    - |
      cat > helm-charts/websocket/values.yaml <<EOF
      image:
        repository: $CI_REGISTRY_IMAGE/websocket
        tag: latest
      service:
        type: ClusterIP
        port: 8080
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/websocket-services: "bingo-websocket"
        hosts:
          - host: ws-bingo.iw7.com.br
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: $TLS_SECRET_NAME
            hosts:
              - ws-bingo.iw7.com.br
      env:
        WS_PORT: 8080
      EOF

deploy:
  stage: deploy
  image: alpine/helm:3.12.3
  only:
    - main
  environment:
    name: production
  script:
    - apk add --no-cache kubectl
    - kubectl config set-cluster k8s --server=$KUBE_SERVER
    - kubectl config set-credentials gitlab --token=$KUBE_TOKEN
    - kubectl config set-context default --cluster=k8s --user=gitlab
    - kubectl config use-context default
    
    # Deploy Database
    - helm upgrade --install bingo-db helm-charts/postgresql-1.0.0.tgz \
      --namespace $KUBE_NAMESPACE \
      --set-file initdbScripts.init.sql=./init.sql
    
    # Deploy Websocket
    - helm upgrade --install bingo-websocket helm-charts/websocket-0.1.0.tgz \
      --namespace $KUBE_NAMESPACE \
      --set ingress.hosts[0].host=ws-bingo.iw7.com.br \
      --set ingress.tls[0].hosts[0]=ws-bingo.iw7.com.br
    
    # Deploy Web
    - helm upgrade --install bingo-web helm-charts/web-0.1.0.tgz \
      --namespace $KUBE_NAMESPACE \
      --set ingress.hosts[0].host=app-bingo.iw7.com.br \
      --set ingress.tls[0].hosts[0]=app-bingo.iw7.com.br